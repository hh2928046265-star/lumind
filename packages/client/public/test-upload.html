<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>识图测试</title></head>
<body style="font-family:sans-serif;padding:40px">
<h2>📷 直接测试 batch-analyze</h2>
<input type="file" id="fileInput" accept="image/*" multiple>
<input id="topicInput" placeholder="主题(可选)" value="晚霞">
<button id="btn">上传并分析</button>
<pre id="result" style="background:#f5f5f5;padding:16px;margin-top:16px;max-height:400px;overflow:auto"></pre>

<script>
document.getElementById('btn').onclick = async () => {
  const files = document.getElementById('fileInput').files;
  const topic = document.getElementById('topicInput').value;
  const result = document.getElementById('result');
  
  if (files.length === 0) { result.textContent = '请先选择图片'; return; }
  
  result.textContent = '上传中...';
  const fd = new FormData();
  for (let i = 0; i < files.length; i++) fd.append('file' + i, files[i]);
  if (topic.trim()) fd.append('topic', topic.trim());
  
  try {
    const resp = await fetch('/api/uploads/batch-analyze', { method: 'POST', body: fd });
    const data = await resp.json();
    result.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    result.textContent = '错误: ' + e.message;
  }
};
</script>
</body></html>
